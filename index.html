<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Simulação Hemodinâmica</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0a0f16">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Hemodinâmica">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-512.png">

<style>
:root{
  --bg:#0a0f16; --panel:#111a24; --panel2:#0d141c; --line:#1f2e3d;
  --text:#dce8f2; --muted:#6c8299; --accent:#35c3ff; --accent2:#5ee3a8;
  --warn:#ffb020; --danger:#ff4d5e; --red:#ff3b4e; --purple:#8a4fd1;
}
*{box-sizing:border-box;}
html,body{height:100%;margin:0;background:var(--bg);color:var(--text);
  font-family:'Segoe UI',system-ui,sans-serif;overflow:hidden;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);}
#app{display:flex;height:100vh;height:100dvh;}
#panel{width:290px;min-width:230px;background:var(--panel);border-right:1px solid var(--line);
  padding:16px;overflow-y:auto;}
#panel h1{font-size:15px;letter-spacing:.5px;color:var(--accent);margin:0 0 4px;}
#panel .sub{font-size:11px;color:var(--muted);margin-bottom:16px;}
.ctrl{margin-bottom:14px;}
.ctrl label{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:4px;}
.ctrl label b{color:var(--text);font-weight:600;}
input[type=range]{width:100%;accent-color:var(--accent);}
#main{flex:1;position:relative;background:radial-gradient(ellipse at 50% 30%,#0e1722,var(--bg));}
canvas{width:100%;height:100%;display:block;}
#tabs{position:absolute;top:12px;left:12px;display:flex;gap:6px;z-index:5;}
#tabs button{background:var(--panel2);border:1px solid var(--line);color:var(--muted);
  padding:8px 12px;border-radius:8px;font-size:12px;cursor:pointer;}
#tabs button.active{background:var(--accent);color:#06141d;border-color:var(--accent);font-weight:600;}
#hud{position:absolute;top:12px;right:12px;background:var(--panel2);border:1px solid var(--line);
  border-radius:10px;padding:10px 14px;font-size:12px;min-width:190px;z-index:5;}
#hud .row{display:flex;justify-content:space-between;padding:2px 0;color:var(--muted);}
#hud .row b{color:var(--text);}
#alerts{position:absolute;bottom:12px;left:12px;right:12px;display:flex;flex-direction:column;
  gap:6px;z-index:5;pointer-events:none;}
.alert{background:rgba(255,77,94,.15);border:1px solid var(--danger);color:#ffd7db;
  padding:8px 12px;border-radius:8px;font-size:12px;font-weight:600;}
.alert.warn{background:rgba(255,176,32,.15);border-color:var(--warn);color:#ffe7bd;}
#status{position:absolute;bottom:12px;right:12px;font-size:11px;color:var(--muted);z-index:5;}
::-webkit-scrollbar{width:6px;} ::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px;}
</style>
</head>
<body>
<div id="app">
  <div id="panel">
    <h1>PAINEL HEMODINÂMICO</h1>
    <div class="sub">Ajuste os parâmetros do paciente</div>
    <div class="ctrl"><label>Freq. Cardíaca <b id="vFC">75 bpm</b></label>
      <input type="range" id="FC" min="20" max="220" value="75"></div>
    <div class="ctrl"><label>Volume Sistólico <b id="vVS">70 ml</b></label>
      <input type="range" id="VS" min="10" max="150" value="70"></div>
    <div class="ctrl"><label>PAS <b id="vPAS">120 mmHg</b></label>
      <input type="range" id="PAS" min="40" max="260" value="120"></div>
    <div class="ctrl"><label>PAD <b id="vPAD">80 mmHg</b></label>
      <input type="range" id="PAD" min="20" max="160" value="80"></div>
    <div class="ctrl"><label>SatO2 <b id="vSAT">98 %</b></label>
      <input type="range" id="SAT" min="50" max="100" value="98"></div>
    <div class="ctrl"><label>Plaquetas <b id="vPLT">250k /uL</b></label>
      <input type="range" id="PLT" min="0" max="400000" step="5000" value="250000"></div>
  </div>
  <div id="main">
    <canvas id="c"></canvas>
    <div id="tabs">
      <button data-v="geral" class="active">Visão Geral</button>
      <button data-v="coracao">Coração</button>
      <button data-v="vasos">Vasos</button>
      <button data-v="pulmoes">Pulmões</button>
    </div>
    <div id="hud">
      <div class="row"><span>Débito Cardíaco</span><b id="hDC">-</b></div>
      <div class="row"><span>PAM</span><b id="hPAM">-</b></div>
      <div class="row"><span>RVPT</span><b id="hRVPT">-</b></div>
      <div class="row"><span>Estado do fluxo</span><b id="hFlux">-</b></div>
    </div>
    <div id="alerts"></div>
    <div id="status">Simulação educacional — não é dispositivo médico</div>
  </div>
</div>
<script>
const S={FC:75,VS:70,PAS:120,PAD:80,SAT:98,PLT:250000};
['FC','VS','PAS','PAD','SAT','PLT'].forEach(k=>{
  const el=document.getElementById(k);
  el.addEventListener('input',()=>{S[k]=+el.value;sync();});
});
function sync(){
  document.getElementById('vFC').textContent=S.FC+' bpm';
  document.getElementById('vVS').textContent=S.VS+' ml';
  document.getElementById('vPAS').textContent=S.PAS+' mmHg';
  document.getElementById('vPAD').textContent=S.PAD+' mmHg';
  document.getElementById('vSAT').textContent=S.SAT+' %';
  document.getElementById('vPLT').textContent=Math.round(S.PLT/1000)+'k /uL';
}
sync();

let view='geral';
document.querySelectorAll('#tabs button').forEach(b=>b.addEventListener('click',()=>{
  document.querySelectorAll('#tabs button').forEach(x=>x.classList.remove('active'));
  b.classList.add('active'); view=b.dataset.v;
}));

const cv=document.getElementById('c'), ctx=cv.getContext('2d');
function resize(){cv.width=cv.clientWidth*devicePixelRatio;cv.height=cv.clientHeight*devicePixelRatio;
  ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);}
addEventListener('resize',resize); resize();

// ---- derived physiology ----
function derive(){
  const DC_ml = S.FC*S.VS, DC = DC_ml/1000;
  const PAM = S.PAD + (S.PAS-S.PAD)/3;
  const RVPT = DC>0 ? PAM/DC : 0;
  const hipoxia = S.SAT<90, crise = S.PAS>=180||S.PAD>=120, colapso=S.PAS<90;
  const choqueBaixo = S.PAS<90 && DC<4.0, choqueDistrib = S.PAS<90 && DC>6.0 && RVPT<10.0;
  const microtrombo = S.PLT<100000, vazamento = S.PLT<50000;
  return {DC,PAM,RVPT,hipoxia,crise,colapso,choqueBaixo,choqueDistrib,microtrombo,vazamento};
}

function bloodColor(sat,alpha=1){
  const t=Math.max(0,Math.min(1,(90-sat)/40)); // 0 normal .. 1 muito hipóxico
  const r=lerp(255,120,t), g=lerp(40,20,t), b=lerp(50,160,t);
  return `rgba(${r|0},${g|0},${b|0},${alpha})`;
}
function lerp(a,b,t){return a+(b-a)*t;}

function updateHUD(d){
  document.getElementById('hDC').textContent=d.DC.toFixed(2)+' L/min';
  document.getElementById('hPAM').textContent=d.PAM.toFixed(1)+' mmHg';
  document.getElementById('hRVPT').textContent=d.RVPT.toFixed(1);
  let flux = d.choqueBaixo?'Fraco / lento':d.choqueDistrib?'Hiperdinâmico / dilatado':d.DC>6?'Hiperdinâmico':'Normal';
  document.getElementById('hFlux').textContent=flux;

  const box=document.getElementById('alerts'); box.innerHTML='';
  const add=(msg,cls)=>{const e=document.createElement('div');e.className='alert'+(cls?' '+cls:'');e.textContent=msg;box.appendChild(e);};
  if(d.crise) add('⚠ CRISE HIPERTENSIVA — risco de ruptura vascular');
  if(d.choqueBaixo) add('⚠ Padrão de choque cardiogênico/hipovolêmico (DC baixo + PAS baixa)');
  if(d.choqueDistrib) add('⚠ Padrão de choque distributivo/séptico (RVPT baixa + DC alto)');
  if(d.hipoxia) add('Hipóxia — SatO2 abaixo de 90%','warn');
  if(d.vazamento) add('Plaquetopenia severa — risco de sangramento','warn');
  else if(d.microtrombo) add('Plaquetas baixas — microtrombos presentes','warn');
}

// particle pool for vessel flow
let particles=[]; for(let i=0;i<60;i++) particles.push({t:Math.random(),lane:Math.random()});
let leaks=[];

let last=performance.now();
function frame(now){
  const dt=Math.min(.05,(now-last)/1000); last=now;
  const d=derive(); updateHUD(d);
  const w=cv.clientWidth,h=cv.clientHeight;
  ctx.clearRect(0,0,w,h);
  if(view==='geral') drawGeral(ctx,w,h,d,now);
  else if(view==='coracao') drawCoracao(ctx,w,h,d,now);
  else if(view==='vasos') drawVasos(ctx,w,h,d,now,dt);
  else drawPulmoes(ctx,w,h,d,now);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

function heartPhase(now,fc){ return (now/1000 * fc/60) % 1; }

// ===================== VISÃO GERAL =====================
function drawGeral(ctx,w,h,d,now){
  const cx=w/2, topY=h*0.08, bodyH=h*0.84;
  ctx.save(); ctx.translate(cx,topY);
  // silhueta
  ctx.strokeStyle='#28384a'; ctx.lineWidth=2; ctx.fillStyle='#0f1b26';
  ctx.beginPath();
  ctx.ellipse(0,bodyH*0.06,bodyH*0.05,bodyH*0.055,0,0,7); // head
  ctx.fill();ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(-bodyH*0.09,bodyH*0.12);
  ctx.quadraticCurveTo(0,bodyH*0.10,bodyH*0.09,bodyH*0.12);
  ctx.lineTo(bodyH*0.16,bodyH*0.42); // right arm/torso
  ctx.quadraticCurveTo(bodyH*0.09,bodyH*0.50,bodyH*0.07,bodyH*0.55);
  ctx.lineTo(bodyH*0.09,bodyH*0.95); // right leg
  ctx.lineTo(bodyH*0.02,bodyH*0.95);
  ctx.lineTo(bodyH*0.015,bodyH*0.56);
  ctx.lineTo(-bodyH*0.015,bodyH*0.56);
  ctx.lineTo(-bodyH*0.02,bodyH*0.95);
  ctx.lineTo(-bodyH*0.09,bodyH*0.95); // left leg
  ctx.lineTo(-bodyH*0.07,bodyH*0.55);
  ctx.quadraticCurveTo(-bodyH*0.09,bodyH*0.50,-bodyH*0.16,bodyH*0.42);
  ctx.closePath(); ctx.fill(); ctx.stroke();
  // heart pulse
  const ph=heartPhase(now,S.FC), beat=Math.pow(Math.sin(ph*Math.PI),6);
  const hr=bodyH*0.028*(1+beat*0.35);
  ctx.fillStyle=bloodColor(S.SAT); ctx.beginPath();
  ctx.ellipse(-bodyH*0.012,bodyH*0.2,hr,hr*1.1,0,0,7); ctx.fill();
  // lungs tint
  ctx.fillStyle = d.hipoxia? 'rgba(138,79,209,.25)':'rgba(53,195,255,.15)';
  ctx.beginPath();ctx.ellipse(-bodyH*0.05,bodyH*0.18,bodyH*0.035,bodyH*0.06,0,0,7);ctx.fill();
  ctx.beginPath();ctx.ellipse(bodyH*0.035,bodyH*0.18,bodyH*0.035,bodyH*0.06,0,0,7);ctx.fill();
  // vessels + flow particles down limbs
  const speed = d.choqueBaixo?0.15:d.choqueDistrib||d.DC>6?1.6:0.7;
  ctx.lineWidth = 3 * (d.choqueDistrib?1.8:1) * (d.colapso?0.5:1);
  ctx.strokeStyle='rgba(255,70,90,.35)';
  const paths=[[-bodyH*0.15,bodyH*0.3,-bodyH*0.09,bodyH*0.95],[bodyH*0.15,bodyH*0.3,bodyH*0.09,bodyH*0.95],
               [0,bodyH*0.22,0,bodyH*0.95]];
  paths.forEach(p=>{ctx.beginPath();ctx.moveTo(p[0],p[1]);ctx.lineTo(p[2],p[3]);ctx.stroke();});
  particles.forEach(pt=>{
    pt.t += 0.006*speed; if(pt.t>1) pt.t=0;
    const p=paths[Math.floor(pt.lane*paths.length)%paths.length];
    const x=lerp(p[0],p[2],pt.t), y=lerp(p[1],p[3],pt.t);
    ctx.fillStyle=bloodColor(S.SAT, d.colapso?0.4:0.9);
    ctx.beginPath();ctx.arc(x,y,2.2,0,7);ctx.fill();
  });
  // cyanosis extremities
  if(d.hipoxia){
    ctx.fillStyle='rgba(120,70,190,.45)';
    [[-bodyH*0.09,bodyH*0.94],[bodyH*0.09,bodyH*0.94],[-bodyH*0.16,bodyH*0.42],[bodyH*0.16,bodyH*0.42]]
      .forEach(p=>{ctx.beginPath();ctx.ellipse(p[0],p[1],bodyH*0.02,bodyH*0.025,0,0,7);ctx.fill();});
  }
  ctx.restore();
  label(ctx,w/2,h-20,'Visão geral: sistema cardiovascular e respiratório integrados');
}

// ===================== ZOOM CORAÇÃO =====================
function drawCoracao(ctx,w,h,d,now){
  const cx=w/2, cy=h/2;
  const ph=heartPhase(now,S.FC);
  const contrac = 0.5+0.5*Math.sin(ph*2*Math.PI); // 0 diástole .. 1 sístole aprox
  const scale = d.colapso? 0.6:1;
  const r = Math.min(w,h)*0.17*scale*(0.85+0.15*contrac);
  ctx.save(); ctx.translate(cx,cy);
  // chambers
  ctx.fillStyle=bloodColor(S.SAT,0.9);
  ctx.beginPath(); ctx.ellipse(-r*0.45,0,r*0.65,r*0.85,0.4,0,7); ctx.fill();
  ctx.beginPath(); ctx.ellipse(r*0.45,0,r*0.65,r*0.85,-0.4,0,7); ctx.fill();
  ctx.strokeStyle='#ffdfe3'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.ellipse(-r*0.45,0,r*0.65,r*0.85,0.4,0,7); ctx.stroke();
  ctx.beginPath(); ctx.ellipse(r*0.45,0,r*0.65,r*0.85,-0.4,0,7); ctx.stroke();
  // ejection jet
  const jetLen = 60*(S.VS/70)*(1+contrac);
  ctx.strokeStyle=bloodColor(S.SAT,0.5+0.4*contrac); ctx.lineWidth=6;
  ctx.beginPath(); ctx.moveTo(0,-r*0.9); ctx.lineTo(0,-r*0.9-jetLen); ctx.stroke();
  ctx.restore();
  label(ctx,w/2,h-40,`Contração a ${S.FC} bpm · Volume Sistólico: ${S.VS} ml`);
  label(ctx,w/2,h-20, d.colapso?'Força de bombeamento reduzida (hipotensão)':'Bombeamento efetivo');
}

// ===================== ZOOM VASOS =====================
let shakeT=0;
function drawVasos(ctx,w,h,d,now,dt){
  const cy=h/2;
  let diam = Math.max(26, Math.min(160, 90 - (d.RVPT-15)*4)); // RVPT baixa -> dilata
  if(d.colapso) diam *= 0.7;
  const wallShake = d.crise ? Math.sin(now*0.08)*6 + (Math.random()-.5)*6 : 0;
  shakeT = d.crise ? Math.min(1,shakeT+dt*0.6) : Math.max(0,shakeT-dt);

  ctx.save();
  // vessel wall
  ctx.fillStyle='#200e14';
  ctx.fillRect(0,cy-diam/2-14,w,diam+28);
  ctx.strokeStyle = d.crise? '#ff5468':'#7a3040'; ctx.lineWidth=6+wallShake*0.2;
  ctx.beginPath(); ctx.moveTo(0,cy-diam/2+wallShake); ctx.lineTo(w,cy-diam/2-wallShake); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(0,cy+diam/2-wallShake); ctx.lineTo(w,cy+diam/2+wallShake); ctx.stroke();
  // lumen
  ctx.fillStyle='rgba(60,10,16,.5)'; ctx.fillRect(0,cy-diam/2,w,diam);

  // rupture burst
  if(shakeT>0.8 && Math.random()<0.15){
    for(let i=0;i<10;i++) leaks.push({x:w*0.5+(Math.random()-.5)*w*0.3,y:cy+(Math.random()-.5)*diam,
      vx:(Math.random()-.5)*2,vy:(Math.random()-1.5)*2,life:1,burst:true});
  }
  if(d.vazamento && Math.random()<0.1){
    leaks.push({x:Math.random()*w,y: Math.random()<0.5?cy-diam/2:cy+diam/2,vx:0,vy:(Math.random()<0.5?-1:1)*0.6,life:1,burst:false});
  }
  leaks.forEach(l=>{l.x+=l.vx;l.y+=l.vy;l.life-=dt*0.6;});
  leaks=leaks.filter(l=>l.life>0);
  leaks.forEach(l=>{ ctx.fillStyle=`rgba(200,20,40,${l.life})`; ctx.beginPath();
    ctx.arc(l.x,l.y, l.burst?5:3, 0,7); ctx.fill(); });

  // flow particles
  const speed = d.choqueBaixo?0.2: (d.DC>6?2.2:1);
  particles.forEach((pt,i)=>{
    pt.t += 0.004*speed; if(pt.t>1) pt.t=0;
    const y=cy + (pt.lane-0.5)*diam*0.8;
    ctx.fillStyle=bloodColor(S.SAT, d.colapso?0.4:1);
    ctx.beginPath(); ctx.arc(pt.t*w, y, 3,0,7); ctx.fill();
  });

  // microthrombi
  if(d.microtrombo){
    ctx.fillStyle='#e8e8e8';
    for(let i=0;i<8;i++){
      const x=(i/8*w + now*0.01*i)%w, y=cy+Math.sin(i*2+now*0.001)*diam*0.3;
      ctx.beginPath(); ctx.arc(x,y,4,0,7); ctx.fill();
    }
  }
  ctx.restore();
  label(ctx,w/2,h-40,`RVPT: ${d.RVPT.toFixed(1)} · Diâmetro relativo: ${diam.toFixed(0)}px`);
  label(ctx,w/2,h-20, d.crise?'PAREDE INSTÁVEL — risco de ruptura':d.colapso?'Paredes murchas (colapso por hipotensão)':
        d.choqueDistrib?'Dilatação extrema (choque distributivo)':'Tônus vascular normal');
}

// ===================== ZOOM PULMÕES =====================
function drawPulmoes(ctx,w,h,d,now){
  const cx=w/2, cy=h/2, R=Math.min(w,h)*0.3;
  ctx.save();
  for(let side=-1;side<=1;side+=2){
    const ox=cx+side*R*0.55;
    ctx.fillStyle='rgba(53,195,255,.08)';
    ctx.beginPath(); ctx.ellipse(ox,cy,R*0.4,R*0.55,0,0,7); ctx.fill();
    ctx.strokeStyle='#2a4256'; ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.ellipse(ox,cy,R*0.4,R*0.55,0,0,7); ctx.stroke();
    for(let i=0;i<10;i++){
      const a=now*0.0005+i; const ax=ox+Math.cos(a*3+i)*R*0.28, ay=cy+Math.sin(a*2+i*1.3)*R*0.4;
      const oxy = (Math.sin(now*0.003+i)+1)/2; // gas exchange cycle
      ctx.fillStyle = bloodColor(lerp(70,S.SAT,oxy));
      ctx.beginPath(); ctx.arc(ax,ay,4,0,7); ctx.fill();
    }
  }
  ctx.restore();
  label(ctx,w/2,h-40,`SatO2: ${S.SAT}%`);
  label(ctx,w/2,h-20, d.hipoxia?'Troca gasosa comprometida — hipóxia':'Oxigenação adequada');
}

function label(ctx,x,y,text){
  ctx.font='13px Segoe UI, sans-serif'; ctx.textAlign='center';
  ctx.fillStyle='#9fb4c7'; ctx.fillText(text,x,y);
}

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(err => console.log('SW falhou:', err));
  });
}
</script>
</body>
</html>
